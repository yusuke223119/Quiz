<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>総合演習 - 統計検定2級学習アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap">
    <link rel="stylesheet" href="app.css?v=tag4">
</head>
<body class="app-shell">
    <div class="app-frame">
        <header class="page-hero">
            <div class="page-hero-bar">
                <a class="page-hero-back" href="index.html" aria-label="ホームに戻る">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <h1>総合演習</h1>
                <span class="page-hero-spacer" aria-hidden="true"></span>
            </div>
            <p class="page-hero-lead">総合問題で実力を伸ばす</p>
            <p class="home-hero-script">See the world through data.</p>
            <img class="page-hero-art" src="picture/home/hero-bars.svg" alt="">
        </header>
        <main class="page-main space-y-3">
            <p class="comp-hint">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 18h6m-5 3h4M8 14.2A6.2 6.2 0 1116 10c0 2.1-1.1 3.4-2.2 4.4-.7.6-1.1 1.3-1.3 2.1H11.5c-.2-.8-.6-1.5-1.3-2.1C9.1 13.4 8 12.1 8 10"/>
                </svg>
                タブで問1〜問3を行き来し、まとめて判定します。
            </p>
            <div id="setList" class="space-y-2.5"></div>
        </main>
    </div>

    <script src="priority.js?v=1"></script>
    <script src="bookmarks.js?v=compstar1"></script>
    <script src="comprehensive_data.js?v=pri1"></script>
    <script src="nav.js?v=home2"></script>
    <script>
        function splitSetName(name) {
            const match = String(name).match(/^(\d{1,2})\.\s*(.+)$/);
            if (!match) return { num: '', title: name };
            return { num: `${match[1].padStart(2, '0')}.`, title: match[2] };
        }

        const COMP_QUESTION_VERSION = 'pri1';
        const list = document.getElementById('setList');

        function renderSetList() {
            list.innerHTML = '';
            comprehensiveMenu.forEach(item => {
                const { num, title } = splitSetName(item.name);
                const starred = typeof hasGenreStar === 'function' && hasGenreStar(item.set);
                const starHtml = starred
                    ? `<span class="comp-star" title="全問正解" aria-label="全問正解">★</span>`
                    : '';
                const link = document.createElement('a');
                link.href = `comprehensive-quiz.html?set=${encodeURIComponent(item.set)}&v=compstar1`;
                link.className = 'comp-card';
                link.innerHTML = `
                    <div class="comp-card-main">
                        <div class="comp-card-head">
                            ${num ? `<span class="comp-num">${num}</span>` : ''}
                            <h2>${title}</h2>
                        </div>
                        <p class="comp-desc">${item.description}</p>
                        <div class="comp-meta">
                            <span class="comp-parts">小問 ${item.parts}問</span>
                            ${item.priorities ? priorityListHtml(item.priorities, false) : ''}
                        </div>
                    </div>
                    ${starHtml}
                    <span class="comp-card-arrow" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </span>
                `;
                list.appendChild(link);
            });
        }

        async function loadSetPriorities(setId) {
            const response = await fetch(`questions/${setId}.js?v=${COMP_QUESTION_VERSION}`);
            if (!response.ok) throw new Error(setId);
            const source = await response.text();
            const data = new Function(`${source}\nreturn typeof comprehensiveSet !== 'undefined' ? comprehensiveSet : null;`)();
            return (data?.parts || []).map(part => part.priority);
        }

        async function refreshSetPriorities() {
            await Promise.all(comprehensiveMenu.map(async item => {
                try {
                    const priorities = await loadSetPriorities(item.set);
                    if (priorities.length) item.priorities = priorities;
                } catch (error) {
                    console.error(`重要度の読み込みに失敗しました: ${item.set}`, error);
                }
            }));
            renderSetList();
        }

        renderSetList();
        refreshSetPriorities();
    </script>
</body>
</html>
