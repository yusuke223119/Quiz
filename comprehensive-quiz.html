<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>総合演習 - 統計検定2級学習アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="app.css?v=statp1">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        #ai-chat-history::-webkit-scrollbar {
            width: 4px;
        }

        #ai-chat-history::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>

<body class="quiz-shell">

    <div class="quiz-frame">

        <div class="app-header">
            <div class="flex items-center justify-between mb-1.5 gap-3">
                <a href="comprehensive.html" class="inline-flex items-center gap-1 text-sm text-white/90">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    大問一覧
                </a>
            </div>
            <div class="flex items-center gap-2 min-w-0 mb-2">
                <span id="questionId" class="bg-blue-400 px-1.5 py-0.5 rounded text-xs font-bold shrink-0">大問</span>
                <h1 id="categoryName" class="text-white text-sm font-bold leading-snug truncate">読み込み中...</h1>
            </div>
            <div class="w-full bg-blue-800 rounded-full h-1.5">
                <div id="progressBar" class="bg-emerald-400 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>

        <div class="p-4 sm:p-6">
            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mb-4">
                <div id="difficultyContainer" class="flex items-center gap-2"></div>
                <div id="priorityContainer" class="flex items-center gap-1.5"></div>
            </div>

            <div id="partTabs" class="flex gap-2 mb-4 overflow-x-auto"></div>

            <div id="stemBox"
                class="mb-5 p-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 text-sm leading-relaxed">
            </div>

            <button type="button" class="stats-table-open" onclick="openStatsTable()" aria-haspopup="dialog" aria-controls="statsTableModal">
                <span class="stats-table-open-label">統計数値表を確認</span>
                <span class="stats-table-open-action">開く</span>
            </button>

            <div id="partQuestion" class="text-slate-700 leading-relaxed mb-6"></div>
            <div id="answerArea" class="grid grid-cols-1 gap-3 mb-6"></div>

            <button type="button" id="judgeBtn" onclick="submitJudgement()"
                class="mb-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98]">
                この大問を判定する
            </button>

            <div id="setResult" class="hidden mb-6 text-center text-sm font-bold text-slate-600"></div>

            <div data-ai-feature class="border-t border-slate-100 pt-6">
                <button type="button" onclick="document.getElementById('aiPanel').classList.toggle('hidden')"
                    class="w-full flex justify-between items-center p-3 bg-blue-50 hover:bg-blue-100 rounded-xl border border-blue-100 transition">
                    <span class="text-sm font-bold text-blue-800">お助けAIパートナー</span>
                    <span class="text-[10px] text-blue-400 font-bold uppercase">開く / 閉じる</span>
                </button>
                <div id="aiPanel" class="hidden mt-3 bg-blue-50 rounded-2xl p-4 border border-blue-100">
                    <div id="ai-chat-history"
                        class="max-h-48 overflow-y-auto mb-4 space-y-3 p-2 bg-white/50 rounded-lg text-sm text-slate-600">
                        <div class="italic text-slate-500">「ヒントが必要な時は何でも聞いてくださいね！」</div>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="userQuestion"
                            class="flex-grow p-3 border border-blue-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm"
                            placeholder="例：この記号の意味は？">
                        <button type="button" onclick="askAI()"
                            class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-sm font-bold transition-all">質問</button>
                    </div>
                    <div id="loading" class="hidden text-xs text-blue-500 mt-2 ml-1 animate-pulse">AI思考中...</div>
                </div>
            </div>

            <div id="answerContainer" class="hidden bg-emerald-50 border-l-4 border-emerald-400 p-4 mt-6">
                <h3 class="text-emerald-800 text-xs font-bold mb-1 uppercase">この小問の正解</h3>
                <div id="answer" class="text-slate-800 text-sm font-bold"></div>
            </div>

            <div id="explanationContainer" class="hidden mt-6 p-6 bg-amber-50 border-l-4 border-amber-400 rounded-r-xl">
                <h2 class="font-bold text-amber-800 mb-2">💡 この小問の解説</h2>
                <div id="explanation" class="text-slate-700 text-sm leading-relaxed"></div>
            </div>

            <a id="backBtn" href="comprehensive.html"
                class="hidden mt-6 block w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg transition-all text-center active:scale-[0.98]">
                総合演習に戻る
            </a>
        </div>
    </div>

    <script src="bookmarks.js?v=compstar1"></script>
    <script src="priority.js?v=1"></script>
    <script src="stats-table.js?v=statp1"></script>
    <script>
        let currentSet = null;
        let currentPartIndex = 0;
        let selectedAnswers = [];
        let hasJudged = false;
        let partResults = [];

        const CHOICE_IDLE = "choice-btn w-full p-4 text-left border-2 border-slate-200 rounded-xl hover:bg-blue-50 hover:border-blue-500 transition-all duration-200";
        const CHOICE_SELECTED = "choice-btn w-full p-4 text-left border-2 border-blue-500 bg-blue-50 rounded-xl transition-all duration-200";
        const CHOICE_CORRECT = "choice-btn w-full p-4 text-left border-2 border-emerald-500 bg-emerald-50 rounded-xl";
        const CHOICE_WRONG = "choice-btn w-full p-4 text-left border-2 border-rose-500 bg-rose-50 rounded-xl";

        window.onload = () => {
            const setId = new URLSearchParams(window.location.search).get('set');
            if (!setId) {
                alert("大問が選択されていません。");
                window.location.href = 'comprehensive.html';
                return;
            }

            const script = document.createElement('script');
            script.src = `questions/${setId}.js`;
            script.onload = () => {
                if (typeof comprehensiveSet === 'undefined' || !comprehensiveSet?.parts?.length) {
                    alert("大問データを読み込めませんでした。");
                    window.location.href = 'comprehensive.html';
                    return;
                }
                currentSet = comprehensiveSet;
                selectedAnswers = currentSet.parts.map(() => null);
                partResults = currentSet.parts.map(() => null);
                if (typeof saveLastStudy === 'function') {
                    saveLastStudy({
                        href: `comprehensive-quiz.html?set=${encodeURIComponent(setId)}`,
                        title: currentSet.title || '総合演習',
                        kind: 'comprehensive'
                    });
                }
                renderSet();
            };
            script.onerror = () => {
                alert("大問データの読み込みに失敗しました。");
                window.location.href = 'comprehensive.html';
            };
            document.body.appendChild(script);
        };

        function replaceImage(text) {
            return String(text || "").replace(/!\[.*?\]\((.*?)\)/g, '<img src="$1" class="w-full h-auto rounded-xl my-4 shadow-sm border border-slate-200">');
        }

        function currentPart() {
            return currentSet.parts[currentPartIndex];
        }

        function renderMeta(difficulty, priority) {
            const diffs = { 1: ["基礎", "bg-emerald-100 text-emerald-700"], 2: ["標準", "bg-blue-100 text-blue-700"], 3: ["応用", "bg-rose-100 text-rose-700"] };
            const [label, color] = diffs[difficulty] || diffs[2];
            document.getElementById("priorityContainer").innerHTML =
                `<span class="text-xs font-bold text-slate-400 tracking-widest">重要度</span>${priorityBadgeHtml(priority)}`;
            document.getElementById("difficultyContainer").innerHTML =
                `<span class="text-xs font-bold text-slate-400 tracking-widest">難易度</span><span class="${color} px-2 py-0.5 rounded text-xs font-bold">${label}</span>`;
        }

        function renderSet() {
            document.getElementById("questionId").innerText = `大問${currentSet.id}`;
            document.getElementById("categoryName").innerText = currentSet.title;
            document.getElementById("stemBox").innerHTML = replaceImage(currentSet.stem);
            document.getElementById("progressBar").style.width = `${((currentPartIndex + 1) / currentSet.parts.length) * 100}%`;

            if (typeof closeStatsTable === "function") closeStatsTable();
            renderTabs();
            renderPart();
        }

        function renderTabs() {
            const tabs = document.getElementById("partTabs");
            tabs.innerHTML = "";
            currentSet.parts.forEach((part, index) => {
                const btn = document.createElement("button");
                btn.type = "button";
                const isActive = index === currentPartIndex;
                let status = "";
                if (hasJudged) {
                    status = partResults[index] ? " ○" : " ×";
                } else if (selectedAnswers[index]) {
                    status = " ●";
                }
                btn.className = isActive
                    ? "px-4 py-2 rounded-full text-sm font-bold bg-blue-600 text-white shadow-sm"
                    : "px-4 py-2 rounded-full text-sm font-bold bg-slate-100 text-slate-600 hover:bg-slate-200";
                btn.textContent = `問${part.id}${status}`;
                btn.onclick = () => selectPart(index);
                tabs.appendChild(btn);
            });
        }

        function selectPart(index) {
            if (typeof closeStatsTable === "function") closeStatsTable();
            currentPartIndex = index;
            document.getElementById("progressBar").style.width = `${((currentPartIndex + 1) / currentSet.parts.length) * 100}%`;
            renderTabs();
            renderPart();
        }

        function renderPart() {
            const part = currentPart();
            renderMeta(part.difficulty || currentSet.difficulty, part.priority || currentSet.priority);
            document.getElementById("partQuestion").innerHTML = `<p class="text-xs font-bold text-blue-600 mb-2">問${part.id}</p>${replaceImage(part.question)}`;

            const ansContainer = document.getElementById("answerArea");
            ansContainer.innerHTML = "";
            part.choices.forEach(choice => {
                const btn = document.createElement("button");
                btn.type = "button";
                const selected = selectedAnswers[currentPartIndex] === choice;
                if (hasJudged) {
                    if (choice === part.answer) {
                        btn.className = CHOICE_CORRECT;
                        btn.innerHTML = selected ? `${choice} : 正解` : choice;
                    } else if (selected) {
                        btn.className = CHOICE_WRONG;
                        btn.innerHTML = `${choice} : 不正解`;
                    } else {
                        btn.className = CHOICE_IDLE;
                        btn.innerHTML = choice;
                    }
                    btn.disabled = true;
                } else {
                    btn.className = selected ? CHOICE_SELECTED : CHOICE_IDLE;
                    btn.innerHTML = choice;
                    btn.onclick = () => selectChoice(choice);
                }
                ansContainer.appendChild(btn);
            });

            if (hasJudged) {
                document.getElementById("answer").innerHTML = replaceImage(part.answer);
                document.getElementById("explanation").innerHTML = replaceImage(part.explanation || "解説なし");
                document.getElementById("answerContainer").classList.remove("hidden");
                document.getElementById("explanationContainer").classList.remove("hidden");
            } else {
                document.getElementById("answerContainer").classList.add("hidden");
                document.getElementById("explanationContainer").classList.add("hidden");
            }

            if (window.MathJax) MathJax.typesetPromise();
        }

        function selectChoice(choice) {
            if (hasJudged) return;
            selectedAnswers[currentPartIndex] = choice;
            renderTabs();
            renderPart();
        }

        function submitJudgement() {
            if (hasJudged || !currentSet) return;
            const unanswered = selectedAnswers.findIndex(answer => !answer);
            if (unanswered >= 0) {
                alert(`問${currentSet.parts[unanswered].id}に回答してから判定してください。`);
                selectPart(unanswered);
                return;
            }

            hasJudged = true;
            partResults = currentSet.parts.map((part, index) => selectedAnswers[index] === part.answer);
            const correctCount = partResults.filter(Boolean).length;
            const allCorrect = currentSet.parts.length > 0 && correctCount === currentSet.parts.length;
            const setId = new URLSearchParams(window.location.search).get('set');
            if (allCorrect && setId && typeof awardGenreStar === 'function') {
                awardGenreStar(setId, currentSet.parts.length);
            }
            document.getElementById("judgeBtn").classList.add("hidden");
            const resultEl = document.getElementById("setResult");
            resultEl.classList.remove("hidden");
            resultEl.innerHTML = allCorrect
                ? `小問 ${currentSet.parts.length} 問中 ${correctCount} 問正解<br><span class="text-amber-600">★ 全問正解！この大問に星がつきました</span>`
                : `小問 ${currentSet.parts.length} 問中 ${correctCount} 問正解`;
            document.getElementById("backBtn").classList.remove("hidden");
            renderTabs();
            renderPart();
        }

        async function askAI() {
            const input = document.getElementById("userQuestion");
            const question = input.value.trim();
            const historyDiv = document.getElementById("ai-chat-history");
            const loadingDiv = document.getElementById("loading");
            if (!question || !currentSet) return;

            const part = currentPart();
            historyDiv.innerHTML += `<div class="text-right ml-8"><div class="inline-block bg-blue-600 text-white p-2 rounded-lg mb-2 text-sm">${question}</div></div>`;
            input.value = "";
            loadingDiv.classList.remove("hidden");
            historyDiv.scrollTop = historyDiv.scrollHeight;

            const prompt = `あなたは統計学の学習支援AIです。
ユーザーの質問に日本語で簡潔かつ正確に答えてください。

質問：
${question}`;

            try {
                let result;
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.askAI && typeof window.__stat2AskNative === "function") {
                    if (!window.__STAT2_APPLE_INTELLIGENCE__) {
                        throw new Error("お助けAIは次のバージョンで提供します。");
                    }
                    const answer = await window.__stat2AskNative(question);
                    result = { answer };
                } else {
                    const response = await fetch('https://ceaslesrkikugqvfwfmd.supabase.co/functions/v1/gemini-chat', {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ prompt: prompt })
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || "通信エラーが発生しました");
                    }
                    result = await response.json();
                }
                if (result.answer) {
                    let aiText = result.answer.replace(/\$(.*?)\$/g, '\\($1\\)');
                    historyDiv.innerHTML += `<div class="bg-slate-100 p-3 rounded-lg text-slate-800 mb-2 border border-slate-200"><b>AIパートナー:</b><br>${aiText}</div>`;
                } else {
                    historyDiv.innerHTML += `<div class="text-rose-500 text-xs p-2">AIが回答を生成できませんでした（ポリシー制限等）。</div>`;
                }
                if (window.MathJax) await MathJax.typesetPromise([historyDiv]);
            } catch (e) {
                historyDiv.innerHTML += `<div class="text-rose-500 text-xs p-2">エラー: ${e.message}</div>`;
            } finally {
                loadingDiv.classList.add("hidden");
                historyDiv.scrollTop = historyDiv.scrollHeight;
            }
        }
    </script>
</body>

</html>
