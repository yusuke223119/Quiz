<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>模試 - 統計検定2級学習アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap">
    <link rel="stylesheet" href="app.css?v=tag4">
</head>
<body class="app-shell">
    <div class="app-frame">
        <header class="page-hero">
            <div class="page-hero-bar">
                <a class="page-hero-back" href="index.html" aria-label="ホームに戻る">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <h1>模試</h1>
                <span class="page-hero-spacer" aria-hidden="true"></span>
            </div>
            <p class="page-hero-lead">本番形式で実力を試す</p>
            <p class="home-hero-script">See the world through data.</p>
            <img class="page-hero-art" src="picture/home/hero-bars.svg" alt="">
        </header>
        <main class="page-main space-y-3">
            <div id="examList" class="space-y-3"></div>
        </main>
    </div>

    <script src="mock_data.js?v=24"></script>
    <script src="nav.js?v=home2"></script>
    <script>
        const list = document.getElementById('examList');

        function progressKey(id) {
            return `mockProgress:${id}`;
        }

        function loadProgress(id) {
            try {
                const parsed = JSON.parse(sessionStorage.getItem(progressKey(id)) || 'null');
                return parsed && typeof parsed === 'object' ? parsed : null;
            } catch {
                return null;
            }
        }

        function clearProgress(id) {
            sessionStorage.removeItem(progressKey(id));
        }

        mockMenu.forEach(item => {
            const progress = loadProgress(item.id);
            const inProgress = progress && !progress.submitted;
            const submitted = progress && progress.submitted;

            const card = document.createElement('div');
            card.className = 'p-4 bg-white border border-slate-100 rounded-2xl shadow-sm';
            card.innerHTML = `
                <div>
                    <h2 class="text-base font-bold text-slate-800">${item.title}</h2>
                    <p class="text-[11px] text-blue-600 font-bold mt-2">大問 ${item.sections} ・ 問題 ${item.questions} ・ ${item.timeLimitMinutes}分</p>
                    <p id="lastScore-${item.id}" class="hidden text-[11px] text-emerald-700 font-bold mt-1"></p>
                </div>
                <div class="mt-4 space-y-2"></div>
            `;
            const actions = card.querySelector('.mt-4');

            if (inProgress) {
                const resume = document.createElement('a');
                resume.href = `mock-quiz.html?exam=${encodeURIComponent(item.file)}&v=rate1`;
                resume.className = 'block w-full p-3 bg-blue-600 hover:bg-blue-700 text-white text-center text-sm font-bold rounded-xl';
                resume.textContent = '続きから受験する';
                actions.appendChild(resume);

                const restart = document.createElement('button');
                restart.type = 'button';
                restart.className = 'block w-full p-3 bg-white border border-slate-200 text-slate-700 text-sm font-bold rounded-xl';
                restart.textContent = 'はじめからやり直す';
                restart.onclick = () => {
                    clearProgress(item.id);
                    window.location.href = `mock-quiz.html?exam=${encodeURIComponent(item.file)}&v=rate1`;
                };
                actions.appendChild(restart);
            } else if (submitted) {
                const scoreEl = card.querySelector(`#lastScore-${item.id}`);
                if (scoreEl && Number(progress.total) > 0) {
                    const correct = Number(progress.correct) || 0;
                    const total = Number(progress.total);
                    const accuracy = progress.accuracy != null
                        ? Number(progress.accuracy)
                        : Math.round((correct / total) * 100);
                    scoreEl.textContent = `前回 ${total} 問中 ${correct} 問正解（正答率 ${accuracy}%）`;
                    scoreEl.classList.remove('hidden');
                }
                const review = document.createElement('a');
                review.href = `mock-quiz.html?exam=${encodeURIComponent(item.file)}&v=rate1`;
                review.className = 'block w-full p-3 bg-blue-600 hover:bg-blue-700 text-white text-center text-sm font-bold rounded-xl';
                review.textContent = '結果を見直す';
                actions.appendChild(review);

                const restart = document.createElement('button');
                restart.type = 'button';
                restart.className = 'block w-full p-3 bg-white border border-slate-200 text-slate-700 text-sm font-bold rounded-xl';
                restart.textContent = 'もう一度受験する';
                restart.onclick = () => {
                    clearProgress(item.id);
                    window.location.href = `mock-quiz.html?exam=${encodeURIComponent(item.file)}&v=rate1`;
                };
                actions.appendChild(restart);
            } else {
                const start = document.createElement('a');
                start.href = `mock-quiz.html?exam=${encodeURIComponent(item.file)}&v=rate1`;
                start.className = 'block w-full p-3 bg-blue-600 hover:bg-blue-700 text-white text-center text-sm font-bold rounded-xl';
                start.textContent = '受験をはじめる';
                actions.appendChild(start);
            }

            list.appendChild(card);
        });
    </script>
</body>
</html>
